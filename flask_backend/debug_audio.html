<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前端音频播放调试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover {
            background: #0056b3;
        }
        audio {
            width: 100%;
            margin: 10px 0;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .warning { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>
    <h1>前端音频播放调试</h1>
    
    <div class="test-section">
        <h2>测试现有音频文件</h2>
        <p><strong>目标文件:</strong> preview_edge_tts_20250924_171923.mp3 (19152 bytes)</p>
        
        <button onclick="testDirectAccess()">1. 直接访问测试</button>
        <button onclick="testAudioElement()">2. Audio元素测试</button>
        <button onclick="testFetch()">3. Fetch加载测试</button>
        <button onclick="simulateVueComponent()">4. 模拟Vue组件流程</button>
        
        <div id="status"></div>
        
        <audio id="testAudio" controls style="display: none;">
            <source src="http://localhost:5000/temp/audio_preview/preview_edge_tts_20250924_171923.mp3" type="audio/mpeg">
            您的浏览器不支持音频播放。
        </audio>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const audio = document.getElementById('testAudio');
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = `${new Date().toLocaleTimeString()}: ${message}`;
            statusDiv.appendChild(div);
            console.log(message);
        }
        
        function testDirectAccess() {
            log('开始直接访问测试...', 'info');
            const url = 'http://localhost:5000/temp/audio_preview/preview_edge_tts_20250924_171923.mp3';
            window.open(url, '_blank');
        }
        
        function testAudioElement() {
            log('开始Audio元素测试...', 'info');
            
            audio.style.display = 'block';
            audio.src = 'http://localhost:5000/temp/audio_preview/preview_edge_tts_20250924_171923.mp3';
            
            audio.onloadstart = () => log('Audio: 开始加载', 'info');
            audio.onloadedmetadata = () => log(`Audio: 元数据加载完成，时长: ${audio.duration}秒`, 'success');
            audio.oncanplay = () => log('Audio: 可以播放', 'success');
            audio.oncanplaythrough = () => log('Audio: 完全加载', 'success');
            
            audio.onerror = (e) => {
                const error = audio.error;
                let errorMsg = '未知错误';
                if (error) {
                    switch(error.code) {
                        case MediaError.MEDIA_ERR_ABORTED:
                            errorMsg = '播放被中止';
                            break;
                        case MediaError.MEDIA_ERR_NETWORK:
                            errorMsg = '网络错误';
                            break;
                        case MediaError.MEDIA_ERR_DECODE:
                            errorMsg = '解码错误';
                            break;
                        case MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED:
                            errorMsg = '不支持的音频格式';
                            break;
                    }
                }
                log(`Audio错误: ${errorMsg}`, 'error');
            };
            
            audio.load(); // 手动触发加载
        }
        
        async function testFetch() {
            log('开始Fetch加载测试...', 'info');
            
            try {
                const url = 'http://localhost:5000/temp/audio_preview/preview_edge_tts_20250924_171923.mp3';
                const response = await fetch(url);
                
                log(`HTTP状态: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                log(`Content-Type: ${response.headers.get('content-type')}`, 'info');
                log(`Content-Length: ${response.headers.get('content-length')} bytes`, 'info');
                
                if (response.ok) {
                    const blob = await response.blob();
                    log(`Blob大小: ${blob.size} bytes`, 'success');
                    log(`Blob类型: ${blob.type}`, 'info');
                    
                    // 创建Blob URL并测试播放
                    const blobUrl = URL.createObjectURL(blob);
                    audio.src = blobUrl;
                    audio.style.display = 'block';
                    log('使用Blob URL设置音频源', 'success');
                } else {
                    log(`请求失败: ${response.status}`, 'error');
                }
            } catch (error) {
                log(`Fetch错误: ${error.message}`, 'error');
            }
        }
        
        async function simulateVueComponent() {
            log('开始模拟Vue组件流程...', 'info');
            
            // 模拟调用TTS API
            try {
                const response = await fetch('http://localhost:5000/api/tts/test', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        engine_id: 'edge_tts',
                        voice_id: 'zh-CN-XiaoxiaoNeural',
                        text: '这是模拟Vue组件的测试'
                    })
                });
                
                log(`TTS API响应: ${response.status}`, response.ok ? 'success' : 'warning');
                
                const result = await response.json();
                
                if (result.success && result.data && result.data.audio_url) {
                    // 模拟Vue中的URL处理逻辑
                    const audioUrl = result.data.audio_url.startsWith('http') 
                        ? result.data.audio_url 
                        : `${window.location.protocol}//${window.location.host}${result.data.audio_url}`;
                    
                    log(`构建音频URL: ${audioUrl}`, 'success');
                    
                    // 设置音频并尝试播放
                    audio.src = audioUrl;
                    audio.style.display = 'block';
                    
                    setTimeout(async () => {
                        try {
                            await audio.play();
                            log('音频播放成功', 'success');
                        } catch (playError) {
                            log(`播放失败: ${playError.message}`, 'error');
                        }
                    }, 1000);
                    
                } else {
                    log(`TTS失败: ${result.message || '未知错误'}`, 'error');
                }
                
            } catch (error) {
                log(`API调用失败: ${error.message}`, 'error');
            }
        }
        
        // 页面加载时自动检查音频文件
        window.addEventListener('load', () => {
            log('页面加载完成，开始检查音频文件...', 'info');
        });
    </script>
</body>
</html>
