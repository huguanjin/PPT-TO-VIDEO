# PPT转视频项目配置文件
# 最后更新: 2025-08-28T09:45:10.568437

# 视频生成配置
video:
  resolution: "1920x1080"  # 视频分辨率
  fps: 30                  # 帧率
  video_bitrate: "5000k"   # 比特率
  background_color: "#000000"  # 背景颜色
  include_subtitles: true  # 是否包含字幕

# TTS语音合成配置
tts:
  preferred_engine: "edge_tts"      # 首选TTS引擎
  preferred_voice: "zh-CN-YunxiNeural"  # 首选语音

# 字幕配置
subtitle:
  enabled: true                     # 启用字幕
  font_family: "Microsoft YaHei"   # 字体
  font_size: 40                     # 字体大小
  font_color: "#e91616"             # 字体颜色 (红色)
  background_color: "rgba(0,0,0,0.8)"  # 背景颜色 (半透明黑)
  position: "bottom"                # 字幕位置

# 元数据
_metadata:
  updated_at: "2025-08-28T09:45:10.568437"
  format_version: "1.0"
  description: "PPT转视频工具的主配置文件"