<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配置测试</title>
</head>
<body>
    <h1>PPT转视频配置测试</h1>
    
    <button onclick="testGetConfig()">获取配置</button>
    <button onclick="testSaveConfig()">保存配置</button>
    
    <div id="result"></div>

    <script>
        async function testGetConfig() {
            try {
                const response = await fetch('/api/config');
                const data = await response.json();
                document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('result').innerHTML = 'Error: ' + error.message;
            }
        }

        async function testSaveConfig() {
            const testConfig = {
                video: {
                    resolution: "1920x1080",
                    fps: 24,
                    video_bitrate: "2000k",
                    background_color: "#FFFFFF",
                    include_subtitles: true
                },
                tts: {
                    edge_voice: "zh-CN-XiaoxiaoNeural",
                    edge_rate: "medium",
                    edge_pitch: "medium",
                    fish_api_key: "",
                    fish_character_id: "",
                    fish_character_name: "",
                    openai_api_key: "",
                    openai_voice: "alloy",
                    openai_model: "tts-1",
                    azure_api_key: "",
                    azure_region: "",
                    azure_voice: "zh-CN-XiaoxiaoNeural",
                    sample_rate: 22050,
                    max_retries: 3,
                    timeout: 30.0
                },
                subtitle: {
                    enabled: true,
                    font_family: "微软雅黑",
                    font_size: 24,
                    font_color: "#FFFFFF",
                    background_color: "#000000",
                    position: "bottom"
                }
            };

            try {
                const response = await fetch('/api/config', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(testConfig)
                });
                const data = await response.json();
                document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('result').innerHTML = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
